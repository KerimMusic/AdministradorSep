<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión de Pagos — OmegaBeats Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Panel <span>Administrativo</span></h1>
    <p>Acceso exclusivo para administradores autorizados</p>
    <button id="loginBtn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Iniciar sesión con Google
    </button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="appScreen">

  <header class="topbar">
    <div class="search-wrap">
      <input id="buscador" type="text" placeholder="BUSCADOR">
    </div>
    <button id="btnBuscar" class="btn-buscar">Buscar</button>
    <div class="admin-info">
      <span class="admin-label">Administrador</span>
      <img id="userPic" class="admin-avatar" src="" alt="">
    </div>
  </header>

  <main class="main">

    <!-- Columna izquierda -->
    <section class="left-col">

      <div class="categoria">
        <h3>🟢 Cuentas aceptadas</h3>
        <div class="thumbs" id="thumbsAceptadas"></div>
      </div>

      <div class="categoria">
        <h3>🟡 Cuentas en espera</h3>
        <div class="thumbs" id="thumbsEspera"></div>
      </div>

      <div class="categoria">
        <h3>🔴 Cuentas rechazadas</h3>
        <div class="thumbs" id="thumbsRechazadas"></div>
      </div>

      <div class="acciones">
        <button class="btn-accion espera"   id="btnEspera">🟡 Pago en revisión</button>
        <button class="btn-accion aceptar"  id="btnAceptar">🟢 Pago aprobado</button>
        <button class="btn-accion rechazar" id="btnRechazar">🔴 Pago rechazado</button>
      </div>

    </section>

    <!-- Columna derecha (ficha) -->
    <section class="right-col">
      <div id="fichaVacia" class="ficha-vacia">
        <p>Selecciona una cuenta para revisar sus datos</p>
      </div>

      <div id="ficha" class="ficha" style="display:none">
        <div class="fila">
          <label>Nombre</label>
          <input id="fNombre" readonly>
        </div>
        <div class="fila">
          <label>Correo</label>
          <input id="fCorreo" readonly>
        </div>
        <div class="fila">
          <label>UID</label>
          <input id="fUid" readonly>
        </div>
        <div class="fila">
          <label>ID de solicitud</label>
          <input id="fSolicitudId" readonly>
        </div>
        <div class="fila">
          <label>Estado actual</label>
          <input id="fEstado" readonly>
        </div>
        <div class="fila">
          <label>Plan</label>
          <input id="fPlan" readonly>
        </div>
        <div class="fila">
          <label>Precio</label>
          <input id="fPrecio" readonly>
        </div>
        <div class="fila">
          <label>Monto registrado</label>
          <input id="fMonto" readonly>
        </div>
        <div class="fila">
          <label>Titular</label>
          <input id="fTitular" readonly>
        </div>
        <div class="fila">
          <label>Banco</label>
          <input id="fBanco" readonly>
        </div>
        <div class="fila">
          <label>Referencia</label>
          <input id="fReferencia" readonly>
        </div>
        <div class="fila">
          <label>Fecha de pago</label>
          <input id="fFechaPago" readonly>
        </div>
        <div class="fila">
          <label>Solicitud creada</label>
          <input id="fFechaSolicitud" readonly>
        </div>
        <div class="fila">
          <label>Última actualización</label>
          <input id="fFechaActualizacion" readonly>
        </div>
        <div class="fila">
          <label>Fecha límite validación</label>
          <input id="fFechaLimite" readonly>
        </div>
        <div class="fila">
          <label>Comprobante</label>
          <button id="btnVerTickque" class="btn-tickque">👁️ Ver ticket</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ══════════ MODAL COMPROBANTE ══════════ -->
<div class="modal" id="modalImg">
  <div class="modal-box">
    <button class="modal-close" data-close="modalImg">×</button>
    <h2>Comprobante de pago</h2>
    <div id="imgViewer"><div class="loading-full">Cargando imagen...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="script.js"></script>
</body>
</html>
